name: Diagnose public SDK availability
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-availability.yml'
permissions:
  contents: read
jobs:
  inspect-public-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official NuGet endpoints without credentials
        shell: python
        run: |
          import urllib.request, urllib.error, json, hashlib, io, zipfile, xml.etree.ElementTree as E
          from datetime import datetime, timezone
          def fetch(label, url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"CSweet-release-availability-check"}), timeout=30) as r:
                      body=r.read(20*1024*1024)
                      print(json.dumps({"endpoint":label,"status":r.status,"host":urllib.parse.urlparse(r.url).hostname,
                        "date":r.headers.get("Date"),"age":r.headers.get("Age"),"cacheControl":r.headers.get("Cache-Control")}))
                      return body
              except urllib.error.HTTPError as e:
                  print(json.dumps({"endpoint":label,"status":e.code,"date":e.headers.get("Date")})); return None
              except Exception as e:
                  print(json.dumps({"endpoint":label,"failureType":type(e).__name__})); return None
          print("Checked UTC: "+datetime.now(timezone.utc).isoformat())
          body=fetch("flat-index","https://api.nuget.org/v3-flatcontainer/csweet.agent.sdk/index.json")
          if body:
              versions=json.loads(body).get("versions",[])
              print(json.dumps({"latestVersions":versions[-12:],"has560":"5.6.0" in versions,"has570":"5.7.0" in versions}))
          for version in ("5.6.0","5.7.0"):
              b=fetch("registration-"+version,"https://api.nuget.org/v3/registration5-gz-semver2/csweet.agent.sdk/"+version+".json")
              if b:
                  d=json.loads(b); print(json.dumps({"version":version,"listed":d.get("listed"),"published":d.get("published")}))
              b=fetch("flat-package-"+version,"https://api.nuget.org/v3-flatcontainer/csweet.agent.sdk/"+version+"/csweet.agent.sdk."+version+".nupkg")
              if b:
                  z=zipfile.ZipFile(io.BytesIO(b)); doc=E.fromstring(z.read(next(n for n in z.namelist() if n.endswith(".nuspec"))))
                  print(json.dumps({"versionRequested":version,"packageMetadata":{e.tag.split("}")[-1]:e.text for e in doc.iter() if e.tag.split("}")[-1] in ("id","version")},"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}))
              fetch("v2-package-"+version,"https://www.nuget.org/api/v2/package/CSweet.Agent.SDK/"+version)
              fetch("gallery-"+version,"https://www.nuget.org/packages/CSweet.Agent.SDK/"+version)
